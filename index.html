<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <!-- PWA -->
  <meta name="theme-color" content="#000000"/>
  <link rel="manifest" href="manifest.json"/>

  <title>Meal Calendar</title>

  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-black text-white min-h-screen">

<div class="max-w-md mx-auto p-4">
  <h1 class="text-2xl font-bold text-center text-blue-400 mb-4">
    📅 Meal Calendar
  </h1>

  <!-- Month Navigation -->
  <div class="flex justify-between items-center mb-3">
    <button onclick="prevMonth()" class="bg-gray-800 px-3 py-2 rounded-lg text-lg">⬅</button>
    <h2 id="monthTitle" class="text-lg text-green-400"></h2>
    <button onclick="nextMonth()" class="bg-gray-800 px-3 py-2 rounded-lg text-lg">➡</button>
  </div>

  <!-- Weekdays -->
  <div class="grid grid-cols-7 text-center text-xs text-gray-400 mb-1">
    <div>Sun</div><div>Mon</div><div>Tue</div>
    <div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
  </div>

  <!-- Calendar -->
  <div id="calendar" class="grid grid-cols-7 gap-2"></div>

  <!-- Summary -->
  <div class="mt-5 bg-gray-900 p-4 rounded-xl text-sm">
    <p>Total Meals: <span id="totalMeals">0</span></p>
    <p>Total Cost: <span id="totalCost">0</span> BDT</p>
  </div>
</div>

<!-- Modal -->
<div id="modal" class="fixed inset-0 bg-black bg-opacity-70 hidden items-center justify-center">
  <div class="bg-gray-900 p-5 rounded-xl w-72">
    <h3 class="text-base mb-3">Edit Meals</h3>
    <p id="selectedDate" class="mb-2 text-sm"></p>
    
    <input type="number" id="mealInput" min="0" max="2"
      class="w-full p-3 text-black rounded text-lg"/>

    <div class="flex justify-between mt-4">
      <button onclick="saveMeal()" class="bg-blue-500 px-4 py-2 rounded-lg w-1/2 mr-2">Save</button>
      <button onclick="closeModal()" class="bg-red-500 px-4 py-2 rounded-lg w-1/2">Cancel</button>
    </div>
  </div>
</div>

<script>
const costPerMeal = 120;
let currentDate = new Date(2026, 0);
let data = JSON.parse(localStorage.getItem('mealCalendar')) || {};
let selectedKey = '';

// Render Calendar
function renderCalendar() {
  const calendar = document.getElementById('calendar');
  calendar.innerHTML = '';

  const year = currentDate.getFullYear();
  const month = currentDate.getMonth();

  const firstDay = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();

  document.getElementById('monthTitle').innerText =
    currentDate.toLocaleString('default', { month: 'short', year: 'numeric' });

  for (let i = 0; i < firstDay; i++) {
    calendar.innerHTML += '<div></div>';
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const key = `${year}-${month+1}-${d}`;
    const meals = data[key] || 0;

    let color = 'bg-gray-800';
    if (meals === 2) color = 'bg-green-700';
    else if (meals === 1) color = 'bg-blue-700';

    calendar.innerHTML += `
      <div onclick="openModal('${key}')"
           class="h-20 flex flex-col justify-between p-2 rounded-xl cursor-pointer ${color} active:scale-95 transition">
        <div class="text-sm font-semibold">${d}</div>
        <div class="text-xs">${meals} meal</div>
      </div>
    `;
  }

  updateSummary();
}

// Open Modal
function openModal(key) {
  selectedKey = key;
  document.getElementById('modal').classList.remove('hidden');
  document.getElementById('modal').classList.add('flex');
  document.getElementById('selectedDate').innerText = key;
  document.getElementById('mealInput').value = data[key] || 0;
}

// Close Modal
function closeModal() {
  document.getElementById('modal').classList.add('hidden');
}

// Save Meal
function saveMeal() {
  const value = parseInt(document.getElementById('mealInput').value);

  if (isNaN(value) || value < 0 || value > 2) {
    alert('Enter 0–2 meals');
    return;
  }

  data[selectedKey] = value;
  localStorage.setItem('mealCalendar', JSON.stringify(data));

  closeModal();
  renderCalendar();
}

// Summary
function updateSummary() {
  let totalMeals = 0;

  Object.values(data).forEach(v => totalMeals += v);

  document.getElementById('totalMeals').innerText = totalMeals;
  document.getElementById('totalCost').innerText = totalMeals * costPerMeal;
}

// Navigation
function prevMonth() {
  currentDate.setMonth(currentDate.getMonth() - 1);
  renderCalendar();
}

function nextMonth() {
  currentDate.setMonth(currentDate.getMonth() + 1);
  renderCalendar();
}

// Register Service Worker
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js')
    .then(() => console.log('SW Registered'))
    .catch(err => console.log(err));
}

// Init
renderCalendar();
</script>

</body>
</html>
